<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crowd Monitor</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <!-- Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <!-- Background Elements for aesthetics -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <i class='bx bx-camera-movie'></i>
                <h1>Crowd<span>Vision</span></h1>
            </div>
            <div class="status-indicator">
                <div class="pulse-dot" id="connection-dot"></div>
                <span id="connection-status">Connecting...</span>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="dashboard-grid">
            <!-- Camera Feed Section -->
            <section class="glass-panel feed-section">
                <div class="panel-header">
                    <h2><i class='bx bx-broadcast'></i> Live Feed</h2>
                    <span class="badge" id="camera-id">CAM-01</span>
                </div>
                <div class="feed-container">
                    <img id="video-feed" src="" alt="Waiting for stream..." class="hidden">
                    <div id="feed-placeholder" class="placeholder">
                        <i class='bx bx-sleepy'></i>
                        <p>No video stream available</p>
                    </div>
                </div>
                <div class="feed-meta">
                    <span id="timestamp"><i class='bx bx-time-five'></i> --:--:--</span>
                    <span id="fps"><i class='bx bx-tachometer'></i> 0 FPS</span>
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                
                <!-- Main Status Card -->
                <div class="glass-card status-card" id="status-card">
                    <h3>Current Status</h3>
                    <div class="status-value" id="crowd-status">UNKNOWN</div>
                    <p class="status-desc" id="status-desc">Waiting for data...</p>
                </div>

                <!-- Metrics Grid -->
                <div class="metrics-grid">
                    <div class="glass-card metric-card">
                        <div class="metric-icon"><i class='bx bx-group'></i></div>
                        <div class="metric-data">
                            <h4>Person Count</h4>
                            <div class="value"><span id="person-count">0</span> / <span id="capacity">0</span></div>
                        </div>
                    </div>

                    <div class="glass-card metric-card">
                        <div class="metric-icon"><i class='bx bx-target-lock'></i></div>
                        <div class="metric-data">
                            <h4>Confidence</h4>
                            <div class="value"><span id="avg-confidence">0</span>%</div>
                        </div>
                    </div>
                </div>

                <!-- Capacity Bar -->
                <div class="glass-card capacity-card">
                    <div class="card-header">
                        <h3>Room Capacity</h3>
                        <span id="capacity-percentage">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="capacity-bar"></div>
                    </div>
                </div>

            </section>

            <!-- History Section -->
            <section class="glass-panel history-section">
                <div class="panel-header">
                    <h2><i class='bx bx-history'></i> Recent Detections</h2>
                </div>
                <div class="history-list" id="history-list">
                    <!-- History items will be populated here -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
