<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crowd Monitor</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <!-- Boxicons for icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <!-- Background Elements for aesthetics -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="container fade-in">
        <!-- Header -->
        <header>
            <div class="logo">
                <i class='bx bx-camera-movie'></i>
                <h1>Crowd<span>Vision</span></h1>
                <span class="badge" id="hw-badge" style="margin-left: 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;">Detecting HW...</span>
            </div>
            <div class="header-right" style="display: flex; gap: 1rem; align-items: center;">
                <div class="status-indicator">
                    <div class="pulse-dot" id="connection-dot"></div>
                    <span id="connection-status">Connecting...</span>
                </div>
                <button id="btn-settings" class="btn-icon" title="Room Settings">
                    <i class='bx bx-cog'></i>
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="dashboard-layout">
            <!-- Cameras Grid -->
            <section class="cameras-grid" id="cameras-container">
                <!-- Camera cards will be dynamically injected here by app.js -->
            </section>

            <!-- Sidebar -->
            <aside class="sidebar fade-in" style="animation-delay: 0.2s;">
                <!-- History Section -->
                <section class="glass-panel history-section">
                    <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <h2><i class='bx bx-history'></i> Global History</h2>
                        <div style="display: flex; gap: 0.5rem;">
                            <button id="btn-view-report" class="btn-icon" title="View Full Report" style="width: 36px; height: 36px; font-size: 1.2rem;">
                                <i class='bx bx-table'></i>
                            </button>
                            <button id="btn-download-report" class="btn-icon" title="Download Report" style="width: 36px; height: 36px; font-size: 1.2rem;">
                                <i class='bx bx-download'></i>
                            </button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="report-table">
                            <thead>
                                <tr>
                                    <th>Waktu</th>
                                    <th>Ruangan</th>
                                    <th>Status</th>
                                    <th>Jumlah</th>
                                </tr>
                            </thead>
                            <tbody id="history-list">
                                <!-- History rows will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </aside>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h2><i class='bx bx-slider-alt'></i> Room Configuration</h2>
                <button id="btn-close-modal" class="btn-icon"><i class='bx bx-x'></i></button>
            </div>
            <div class="modal-body">
                <div class="add-room-form">
                    <h3 id="form-title">Add Room</h3>
                    <div class="form-group">
                        <input type="text" id="input-room-id" placeholder="Room Name (e.g. Kantin)">
                        <input type="number" id="input-capacity" placeholder="Capacity (e.g. 50)">
                        <input type="text" id="input-esp32-id" placeholder="ESP32 ID (Optional)">
                        <div style="display: flex; gap: 10px; width: 100%;">
                            <button id="btn-save-room" class="btn-primary" style="flex: 1;">Save</button>
                            <button id="btn-cancel-edit" class="btn-secondary hidden" style="flex: 1;">Cancel</button>
                        </div>
                    </div>
                </div>
                <div class="room-list-container" style="margin-bottom: 20px;">
                    <h3>Live Connected ESP32s</h3>
                    <ul id="active-esps-list" class="room-list">
                        <li style="color:var(--text-muted)">No ESP32s connected.</li>
                    </ul>
                </div>
                <div class="room-list-container">
                    <h3>Configured Rooms</h3>
                    <ul id="settings-room-list" class="room-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- History Report Modal -->
    <div id="report-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel" style="max-width: 800px; max-height: 85vh; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h2><i class='bx bx-table'></i> Laporan Lengkap Keramaian</h2>
                <button id="btn-close-report" class="btn-icon"><i class='bx bx-x'></i></button>
            </div>
            <div class="modal-body" style="overflow-y: auto; flex-grow: 1; padding-right: 0.5rem;">
                <div class="table-container" style="max-height: 100%;">
                    <table class="report-table" style="width: 100%;">
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Ruangan (Kamera ID)</th>
                                <th>Status</th>
                                <th>Jumlah Orang</th>
                                <th>Kapasitas</th>
                            </tr>
                        </thead>
                        <tbody id="full-history-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=4"></script>
</body>
</html>
